services:
  - type: web
    name: stockpulse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SITE_PASSWORD
        sync: false
      - key: MARKETAUX_API_KEY
        sync: false

services:
  postgres:
    image: postgres:16-alpine
    container_name: borsel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: borsel_user
      POSTGRES_PASSWORD: borsel_password
      POSTGRES_DB: borsel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borsel_user -d borsel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: borsel-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://borsel_user:borsel_password@postgres:5432/borsel_db
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn borsel_handler.api.app:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:20-alpine
    container_name: borsel-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: >
      sh -c "npm install &&
             npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
